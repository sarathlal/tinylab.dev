# DevOps curriculum — the single source of truth for this subject's structure.
# `python3 scripts/scaffold.py devops` turns it into stub pages under _devops/.
# Existing pages are never overwritten. See CLAUDE.md for the writing standard.
#
# Fields per page: slug, title, level (foundation|intermediate|advanced), covers (outline), lab (true for labs)

track: devops
title: DevOps
sections:
- name: Getting started
  folder: getting-started
  pages:
  - slug: what-is-devops
    title: What is DevOps, really?
    level: foundation
    covers:
    - The problem DevOps solves — the wall between "writing software" and "running software"
    - What a DevOps engineer actually does day to day
    - The toolchain at a glance and how the sections of this course map to it
    - Related roles — SRE, platform engineer, cloud engineer — and how they differ
  - slug: learning-path
    title: The learning path — which subjects to learn, in what order
    level: foundation
    covers:
    - How Linux, Networking, Docker, Kubernetes, Scripting, Terraform and Prometheus fit together
    - A suggested order with what each unlocks
    - How much time to budget
  - slug: setting-up-your-machine
    title: Setting up your machine
    level: foundation
    covers:
    - Installing a terminal, Git, Docker and a code editor on Linux, macOS and Windows (WSL2)
    - Creating a free GitHub account and SSH keys
    - A scratch Linux VM or cloud free tier for experiments
    - How to check everything works
  - slug: how-to-learn-this-course
    title: How to learn this course
    level: foundation
    covers:
    - Reading order and how the sections depend on each other
    - Keeping a lab notebook and a portfolio repository
    - When to skip ahead and when not to
- name: CI/CD and GitOps
  folder: cicd
  pages:
  - slug: what-is-ci-cd
    title: What CI and CD actually mean
    level: foundation
    covers:
    - Continuous integration, delivery and deployment, and the difference
    - What a pipeline is and what a good one guarantees
  - slug: your-first-pipeline
    title: Your first pipeline
    level: foundation
    covers:
    - GitHub Actions basics — workflows, jobs, steps, runners
    - Lint, test, build on every push
    - Reading logs and fixing a failing run
  - slug: building-images-in-ci
    title: Building and publishing images in CI
    level: intermediate
    covers:
    - BuildKit in CI, layer caching, multi-platform builds
    - Tagging strategy — semantic version plus commit SHA
    - Pushing to a registry with short-lived credentials
  - slug: testing-and-quality-gates
    title: Tests, scans and quality gates
    level: intermediate
    covers:
    - Unit, integration and end-to-end tests in a pipeline
    - Image scanning, dependency scanning, linting as gates
    - Keeping pipelines fast — parallelism and caching
  - slug: artifact-promotion
    title: Promoting one artifact from dev to production
    level: intermediate
    covers:
    - Build once, deploy many
    - Immutable digests and environment configuration
    - Approvals and manual gates
  - slug: deployment-strategies
    title: Rolling, blue/green and canary deployments
    level: intermediate
    covers:
    - What each strategy trades off
    - Argo Rollouts and Flagger
    - Automated rollback on bad metrics
  - slug: gitops
    title: GitOps — Git as the source of truth
    level: intermediate
    covers:
    - Pull-based deployment with Argo CD or Flux
    - Repository layouts, environment promotion with pull requests
    - Drift detection and secrets in GitOps
  - slug: runners-and-security
    title: Runners, secrets and pipeline security
    level: intermediate
    covers:
    - Hosted vs self-hosted runners, ephemeral runners
    - Secrets in CI, OIDC to cloud providers instead of static keys
    - Supply-chain risks in pipelines
  - slug: other-ci-systems
    title: GitLab CI, Jenkins and Tekton
    level: intermediate
    covers:
    - The same ideas in other systems
    - Migrating between them
  - slug: lab-end-to-end-pipeline
    title: 'Lab: a pipeline from commit to cluster'
    level: intermediate
    lab: true
    covers:
    - Build, test, scan, sign, push, deploy to staging via Argo CD, promote to production
    - Measure pipeline time and cut it
