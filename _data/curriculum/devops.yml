# DevOps track curriculum.
#
# This file is the single source of truth for the track's structure.
# `scripts/scaffold.py devops` turns it into stub pages under _devops/;
# existing pages are never overwritten. Write each page later by replacing
# the stub's body (see CLAUDE.md for the writing standard).
#
# Fields per page:
#   slug     file name (without NN- prefix or .md); becomes the URL
#   title    page title
#   level    foundation | intermediate | advanced
#   covers   bullet list of what the finished page must explain
#   lab      true for hands-on lab pages

track: devops
title: DevOps

sections:

  - name: Getting started
    folder: getting-started
    pages:
      - slug: what-is-devops
        title: What is DevOps, really?
        level: foundation
        covers:
          - The problem DevOps solves — the wall between "writing software" and "running software"
          - What a DevOps engineer actually does day to day
          - The toolchain at a glance and how the sections of this course map to it
          - Related roles — SRE, platform engineer, cloud engineer — and how they differ
      - slug: setting-up-your-machine
        title: Setting up your machine
        level: foundation
        covers:
          - Installing a terminal, Git, Docker and a code editor on Linux, macOS and Windows (WSL2)
          - Creating a free GitHub account and SSH keys
          - A scratch Linux VM or cloud free tier for experiments
          - How to check everything works
      - slug: terminal-survival-guide
        title: Terminal survival guide
        level: foundation
        covers:
          - Moving around, listing, reading and editing files
          - Pipes, redirection and exit codes
          - Getting help — man, --help, tldr
          - Keyboard shortcuts and a sane shell configuration
      - slug: how-to-learn-this-course
        title: How to learn this course
        level: foundation
        covers:
          - Reading order and how the sections depend on each other
          - Keeping a lab notebook and a portfolio repository
          - When to skip ahead and when not to

  - name: Linux
    folder: linux
    pages:
      - slug: what-is-linux
        title: What is Linux and why servers run it
        level: foundation
        covers:
          - Kernel vs distribution vs desktop environment
          - Major distribution families (Debian/Ubuntu, RHEL/Fedora, Alpine, Arch) and when each is used
          - The Unix philosophy and why it still shapes tooling
      - slug: filesystem-layout
        title: The filesystem — where everything lives
        level: foundation
        covers:
          - The Filesystem Hierarchy Standard, directory by directory
          - Absolute vs relative paths, hidden files, symlinks and hard links
          - Mount points and what "everything is a file" means
      - slug: users-groups-permissions
        title: Users, groups and permissions
        level: foundation
        covers:
          - Owners, groups, rwx bits and octal notation
          - sudo, root, and why services run as unprivileged users
          - setuid, setgid, sticky bit, umask, ACLs
      - slug: processes
        title: Processes — what is running and why
        level: foundation
        covers:
          - PIDs, parents and children, the process tree
          - Process states, zombies and orphans
          - Signals and what SIGTERM, SIGKILL and SIGHUP mean
          - ps, top, htop, pgrep, kill, nice
      - slug: systemd-and-services
        title: systemd — how services start, stop and restart
        level: intermediate
        covers:
          - Boot sequence from firmware to login
          - Units, targets, dependencies and the unit file format
          - systemctl, journalctl, timers as a cron replacement
          - Writing and debugging your own service unit
      - slug: package-management
        title: Installing software — package managers
        level: foundation
        covers:
          - apt, dnf, apk, pacman — the same ideas, different spellings
          - Repositories, signing keys, pinning versions
          - Building from source and when to avoid it
      - slug: memory
        title: Memory — what "free" actually means
        level: intermediate
        covers:
          - Virtual vs resident memory, shared pages, the page cache
          - Reading free, /proc/meminfo and top correctly
          - Swap and the OOM killer, and how it chooses a victim
      - slug: storage-and-filesystems
        title: Disks, partitions and filesystems
        level: intermediate
        covers:
          - Block devices, partitions, LVM
          - ext4 vs xfs vs btrfs; inodes and why a disk can be "full" with space left
          - Mounting, fstab, df vs du, finding what filled a disk
      - slug: performance-basics
        title: Performance — is the machine busy, and with what?
        level: intermediate
        covers:
          - Load average and what it really measures
          - CPU, memory, disk and network bottlenecks with vmstat, iostat, sar
          - The USE method as a checklist
      - slug: logs-and-journald
        title: Logs — where to look when something breaks
        level: foundation
        covers:
          - /var/log, syslog and journald
          - Reading, filtering and following logs
          - Log rotation and disk pressure
      - slug: networking-on-linux
        title: Networking on a Linux machine
        level: intermediate
        covers:
          - Interfaces, addresses, routes with ip
          - ss, netstat, lsof for open ports and connections
          - /etc/hosts, resolv.conf and name resolution order
          - firewalld, ufw and the iptables/nftables underneath
      - slug: ssh
        title: SSH — working on machines you can't touch
        level: foundation
        covers:
          - Keys vs passwords, ssh-agent, config file
          - Tunnels, port forwarding, jump hosts
          - Hardening sshd
      - slug: cron-and-scheduling
        title: Running things on a schedule
        level: foundation
        covers:
          - crontab syntax and common mistakes
          - systemd timers
          - Locking and idempotency for scheduled jobs
      - slug: lab-broken-server
        title: "Lab: fix a deliberately broken server"
        level: intermediate
        lab: true
        covers:
          - A VM with five planted faults (disk full, failed service, bad DNS, firewall rule, runaway process)
          - A method for diagnosing each
          - Writing a short root-cause note

