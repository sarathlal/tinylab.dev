# Site settings
title: TinyLab
email: hello@tinylab.dev
description: >-
  Plain-language tutorials for people building a career in tech: DevOps, Docker,
  Kubernetes, Linux, Python, Go, Rust and React — plus a daily AI news brief.
baseurl: ""
url: "https://tinylab.dev"
author: Sarathlal N
github_username: sarathlal
repository: sarathlal/tinylab.dev
lang: en

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
  toc_levels: 2..3
future: true
timezone: Asia/Kolkata

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - _templates
  - vendor
  - node_modules

permalink: :title/

# -----------------------------------------------------------------------------
# Collections
#
# Every learning track is a collection. Files are ordered by the `order`
# front-matter field (and grouped by `section`), never by date.
# To add a new track: create `_<track>/`, add it here, and add it to
# `_data/tracks.yml`. Nothing else needs to change.
# -----------------------------------------------------------------------------
collections:
  ai_news:
    output: true
    permalink: /news/ai/:slug/
  devops:
    output: true
    permalink: /learn/devops/:path/
  # python:
  #   output: true
  #   permalink: /learn/python/:path/

defaults:
  - scope:
      path: ""
      type: ai_news
    values:
      layout: post
  - scope:
      path: ""
      type: devops
    values:
      layout: tutorial
      track: devops
  - scope:
      path: ""
      type: posts
    values:
      layout: post
