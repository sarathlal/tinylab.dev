# Site settings
title: TinyLab
email: hello@tinylab.dev
description: >-
  Plain-language tutorials for people building a career in tech: DevOps, Docker,
  Kubernetes, Linux, Python, Go, Rust and React — plus a daily AI news brief.
baseurl: ""
url: "https://tinylab.dev"
author: Sarathlal N
github_username: sarathlal
repository: sarathlal/tinylab.dev
lang: en

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
  toc_levels: 2..3
future: true
timezone: Asia/Kolkata

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - _templates
  - vendor
  - node_modules

permalink: :title/

# -----------------------------------------------------------------------------
# Collections
#
# Every subject is a collection. Files are ordered by section_order/order
# front matter (from _data/curriculum/<subject>.yml), never by date.
# To add a subject: curriculum file + folder + entry here + _data/tracks.yml,
# then `python3 scripts/scaffold.py <subject>`.
# -----------------------------------------------------------------------------
collections:
  ai_news:
    output: true
    permalink: /news/ai/:slug/
  linux:
    output: true
    permalink: /learn/linux/:path/
  networking:
    output: true
    permalink: /learn/networking/:path/
  docker:
    output: true
    permalink: /learn/docker/:path/
  kubernetes:
    output: true
    permalink: /learn/kubernetes/:path/
  scripting:
    output: true
    permalink: /learn/scripting/:path/
  terraform:
    output: true
    permalink: /learn/terraform/:path/
  prometheus:
    output: true
    permalink: /learn/prometheus/:path/
  devops:
    output: true
    permalink: /learn/devops/:path/

defaults:
  - scope:
      path: ""
      type: ai_news
    values:
      layout: post
  - scope:
      path: ""
      type: linux
    values:
      layout: tutorial
      track: linux
  - scope:
      path: ""
      type: networking
    values:
      layout: tutorial
      track: networking
  - scope:
      path: ""
      type: docker
    values:
      layout: tutorial
      track: docker
  - scope:
      path: ""
      type: kubernetes
    values:
      layout: tutorial
      track: kubernetes
  - scope:
      path: ""
      type: scripting
    values:
      layout: tutorial
      track: scripting
  - scope:
      path: ""
      type: terraform
    values:
      layout: tutorial
      track: terraform
  - scope:
      path: ""
      type: prometheus
    values:
      layout: tutorial
      track: prometheus
  - scope:
      path: ""
      type: devops
    values:
      layout: tutorial
      track: devops
  - scope:
      path: ""
      type: posts
    values:
      layout: post
